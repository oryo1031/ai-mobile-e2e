[project]
name = "ai-mobile-e2e"
version = "0.1.0"
description = "Flutter アプリの E2E テストを AI エージェントで進めるハーネス"
requires-python = ">=3.12"
dependencies = [
    "Appium-Python-Client>=6.0.0",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "allure-pytest>=2.13",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "openpyxl>=3.1.5",
]

[project.scripts]
e2e = "e2e_harness.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema>=4.26.0.20260518",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: Appium を使う E2E テスト",
    "android: Android 固有のテスト",
    "ios: iOS 固有のテスト",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# 生成物も生成器側の責任で lint に通す。除外しない。
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/pages"]

[[tool.mypy.overrides]]
module = ["appium.*", "selenium.*", "allure.*"]
ignore_missing_imports = true
